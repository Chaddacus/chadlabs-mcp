name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build core first so dependent packages can resolve its types.
      - run: pnpm --filter @chadlabs/core build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Network locality smoke — bookkeeping (claim c6)
        run: pnpm --filter @chadlabs/bookkeeping smoke:network
      - name: Network locality smoke — prior-auth (claim c6)
        run: pnpm --filter @chadlabs/prior-auth smoke:network
      - name: Network locality smoke — commission-recon (claim c6)
        run: pnpm --filter @chadlabs/commission-recon smoke:network
      - name: Build everything
        run: pnpm -r build
      - name: Verify all published tarballs exclude tests / eval / providers / specs / scripts
        run: |
          for pkg in bookkeeping prior-auth commission-recon; do
            cd packages/$pkg
            pnpm pack
            if tar -tzf chadlabs-$pkg-*.tgz | grep -E '(^|/)(eval|providers|specs|scripts|__tests__|__fixtures__)/|\.test\.|vitest' ; then
              echo "FAIL: $pkg tarball leaked dev artifacts"
              exit 1
            fi
            echo "OK: $pkg tarball clean"
            rm chadlabs-$pkg-*.tgz
            cd ../..
          done
