# Custom nginx server block for bookkeeping-landing.
# Mounted into /etc/nginx/conf.d/default.conf to override the stock one.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS — safe even though TLS terminates at Traefik; Traefik does not strip
    # response headers we set.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # We don't load remote scripts or fonts; lock it down.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Tiny brochure site — favicon and robots are optional.
    location = /robots.txt {
        add_header Content-Type "text/plain";
        return 200 "User-agent: *\nAllow: /\nSitemap: https://bookkeeping.chadacus.dev/sitemap.xml\n";
    }

    # Health probe for the Traefik load balancer / monitoring.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type "text/plain";
    }
}
